name: Compute Provisioning/Deprovisoning
on:
  workflow_dispatch:

    inputs:
      actions:
        description: 'Select action to perform'
        required: true
        type: choice
        options:
        - Create
        - Delete

      region:
        description: 'AWS Region required for creation'
        required: false
        type: choice
        options:
        - us-east-1
        - eu-central-1
        
      instance_type:
        description: 'EC2 Instance Type required for creation'
        required: false
        type: string

      tenant_id:
        description: 'Tenant ID for deletion'
        required: false
        type: string

jobs:
  Create:
    if: inputs.actions == 'Create'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws/cloud-infra/envs/dev/compute
    steps:
      - name: Validate required inputs
        working-directory: .
        run: |
          if [[ -z "${{ inputs.region }}" || -z "${{ inputs.instance_type }}" ]]; then
            echo "Error: Both 'region' and 'instance_type' inputs are required for creation."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.0

      - name: Generate Tenant ID
        id: tenant
        run: |
          TENANT_ID=$(uuidgen | tr '[:upper:]' '[:lower:]')
          echo "TENANT_ID=$TENANT_ID" >> $GITHUB_OUTPUT
          echo "Generated Tenant ID: $TENANT_ID"
          
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=s3-terraform-state-12345" \
            -backend-config="key=tenants/${{ steps.tenant.outputs.tenant_id }}/terraform.tfstate" \
            -backend-config="region=ap-south-1"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var="region=${{ inputs.region }}" \
            -var="instance_type=${{ inputs.instance_type }}" \
            -var="tenant_id=${{ steps.tenant.outputs.tenant_id }}"

      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -var="region=${{ inputs.region }}" \
            -var="instance_type=${{ inputs.instance_type }}" \
            -var="tenant_id=${{ steps.tenant.outputs.tenant_id }}"

  Delete:
    if: inputs.actions == 'Delete'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws/cloud-infra/envs/dev/compute
    steps:
      - name: Validate required inputs
        working-directory: .
        run: |
          if [[ -z "${{ inputs.tenant_id }}" ]]; then
            echo "Error: 'tenant_id' input is required for deletion."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.0

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=s3-terraform-state-12345" \
            -backend-config="key=tenants/${{ inputs.tenant_id }}/terraform.tfstate" \
            -backend-config="region=ap-south-1"

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -input=false \
            -auto-approve \
            -var="tenant_id=${{ inputs.tenant_id }}"